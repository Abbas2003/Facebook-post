<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Navbar -->
    <div class="bg-primary py-5 px-5 d-flex">
      <div>
        <!-- <i class="fa-brands fa-facebook"></i> -->
      </div>
      <h3 class="text-white ps-4">Facebook Signup</h3>
    </div>

    <!-- Hero section -->
    <div class="container">
      <div class="row">
        <div class="col-md-7 col-sm-12">
          <div class="p-3">
            <div class="my-3">
              <input
                type="text"
                name="userName"
                id="userName"
                class="border-bottom border-0 bg-light rounded p-2 "
                placeholder="Enter username"
              />
            </div>
            <div class="my-3">
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
                class="border-bottom border-0 bg-light rounded outline-0 p-2"
              />
            </div>
            
            <div class="my-3">
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your Password"
                class="border-bottom border-0 bg-light rounded p-2"
              />
            </div>
            <button class="btn btn-primary w-25 shadow-none" onclick="Signup()">
              Signup
            </button>
            <div id="successMsg"></div>
          </div>
        </div>
        <div class="col-md-5 col-sm-12">
          <div>
            <img src="https://cdn.dribbble.com/users/277921/screenshots/4223608/gw-dribbble.gif" alt="gif" class="img-fluid">
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="signup.js"></script>
  </body>
</html>
